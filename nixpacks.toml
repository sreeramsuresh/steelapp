[phases.setup]
nixPkgs = ['php82', 'nodejs-18_x']

[phases.install]
cmds = [
    'npm install'
]

[phases.build]
cmds = [
    'npm run build',
    'echo "Build completed, checking dist directory:"',
    'ls -la dist/',
    'echo "Copying backend files..."',
    'cp -r backend/* .',
    'echo "Copying built React app..."',
    'cp -rf dist/* .',
    'echo "Final directory structure:"',
    'ls -la',
    'echo "Checking final index.html:"',
    'head -n 10 index.html || echo "No index.html found"'
]

[start]
cmd = 'php -S 0.0.0.0:$PORT -t .'