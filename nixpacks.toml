[phases.setup]
nixPkgs = ['php82', 'nodejs-18_x']

[phases.install]
cmds = [
    'npm install',
    'npm run build'
]

[phases.build]
cmds = [
    'echo "Build phase starting..."',
    'rm -f index.html index.php',
    'cp -r backend/* .',
    'cp -r dist/* .',
    'echo "Files after copy:"',
    'ls -la',
    'echo "Checking index.html content:"',
    'head -n 5 index.html || echo "No index.html found"'
]

[start]
cmd = 'php -S 0.0.0.0:$PORT -t .'